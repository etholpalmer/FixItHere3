name: CI

# PAUSED 2026-07-20 — manual trigger only, nothing runs automatically.
# The workflow is intact; the believability rebuild will churn the tests and
# DTOs heavily (SeedTests' fingerprint is a compile dependency, and the Shared
# DTO changes break four test files by design), so automatic red is noise
# rather than signal for that stretch.
#
# TO RE-ENABLE: restore the two lines below and delete this block.
#   push:
#   pull_request:
#     branches: [main]
on:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # NOTE: deliberately NOT `dotnet test FixItHere.Demo.slnx`.
      # The solution includes Customer.Mobile and Provider.Mobile, whose
      # net10.0-android / net10.0-ios target frameworks need a Java SDK and
      # Xcode's actool. Building those here fails for reasons unrelated to the
      # tests. All four test projects target plain net10.0 and reference only
      # src/Shared and src/Backend.Api, so they need no MAUI workload.
      - name: Restore
        run: |
          for p in tests/Shared.Tests tests/Backend.Api.Tests \
                   tests/Customer.Mobile.Tests tests/Provider.Mobile.Tests; do
            dotnet restore "$p"
          done

      - name: Shared (domain + state machine)
        run: dotnet test tests/Shared.Tests -c Release --no-restore --logger "trx;LogFileName=shared.trx" --results-directory artifacts/tests

      - name: Backend.Api (endpoint integration)
        run: dotnet test tests/Backend.Api.Tests -c Release --no-restore --logger "trx;LogFileName=backend.trx" --results-directory artifacts/tests

      - name: Customer.Mobile (MVU update)
        run: dotnet test tests/Customer.Mobile.Tests -c Release --no-restore --logger "trx;LogFileName=customer.trx" --results-directory artifacts/tests

      - name: Provider.Mobile (MVU update)
        run: dotnet test tests/Provider.Mobile.Tests -c Release --no-restore --logger "trx;LogFileName=provider.trx" --results-directory artifacts/tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/tests
          if-no-files-found: ignore

  # The test projects compile Domain/Update/Api but NOT Views/*.fs or
  # MauiProgram.fs — those are only ever compiled by the app projects. Without
  # this job a broken view ships green. Mac Catalyst is the plan's designated
  # verification platform; android/ios are intentionally not built (see the
  # note in the test job).
  # This job's history, kept because it explains the unusual shape below. Four
  # gating strategies failed against the hosted image before this one:
  # version selection, SDK-directory existence, an xcrun name-resolution probe,
  # and finally an exact-call probe — which every install PASSES in a plain
  # step while the identical call FAILS under MSBuild ("SDK cannot be located",
  # actool exit 72). The failure is a property of the build environment, not
  # of any Xcode install, so no pre-flight check can predict it. The design is
  # therefore build-then-classify: run the builds, and if they fail with a
  # known environment signature, skip loudly with exit 0; any other failure is
  # a real code failure and gates. No continue-on-error — when the image
  # works, a broken view blocks the merge, which is this job's whole purpose.
  build-apps:
    name: Build apps (Mac Catalyst)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find a usable Xcode
        id: xcode
        run: |
          # The probe must be the EXACT call the MacCatalyst targets make:
          # xcodebuild with the SDK as an explicit path. `xcrun --sdk macosx`
          # resolves by NAME and false-passed on an install whose SDK directory
          # exists but is not registered — the build then failed with
          # "SDK cannot be located" against the very same path.
          probe() {
            "$1/Contents/Developer/usr/bin/xcodebuild" \
              -sdk "$1/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" \
              -find actool >/dev/null 2>&1
          }
          usable=""
          for app in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V); do
            if probe "$app"; then
              echo "probe PASS: $app"
              usable="$app"   # keep the newest that passes; loop continues
            else
              echo "probe fail: $app"
            fi
          done
          if [ -z "$usable" ]; then
            # One repair attempt on the newest install: first-launch registers
            # platform components that a fresh image may never have initialized.
            newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
            if [ -n "$newest" ]; then
              sudo xcode-select -s "$newest/Contents/Developer"
              sudo xcodebuild -runFirstLaunch || true
              if probe "$newest"; then
                echo "probe PASS after runFirstLaunch: $newest"
                usable="$newest"
              fi
            fi
          fi
          if [ -n "$usable" ]; then
            sudo xcode-select -s "$usable/Contents/Developer"
            xcodebuild -version
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Mac Catalyst build skipped::No Xcode on this image passes the explicit-path 'xcodebuild -sdk ... -find actool' probe. This is a runner-image defect, not a code failure. The build will gate again automatically once the image ships a usable Xcode."
            echo "usable=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.xcode.outputs.usable == 'true'
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        if: steps.xcode.outputs.usable == 'true'
        run: dotnet workload install maui

      # Prediction failed twice: every Xcode on the image passes the exact
      # `xcodebuild -sdk <path> -find actool` call in a plain step, and the very
      # same call fails with "SDK cannot be located" when the MacCatalyst
      # targets invoke it under MSBuild. The failure is a property of the build
      # environment, not the install — so no pre-flight probe can gate it.
      # Instead: build, and classify the outcome. Known environment signatures
      # skip loudly with exit 0; anything else is a real code failure and gates.
      - name: Build apps (classify environment failures)
        if: steps.xcode.outputs.usable == 'true'
        run: |
          set -o pipefail
          echo "--- env vars xcodebuild is sensitive to ---"
          env | grep -iE '^(SDKROOT|DEVELOPER_DIR|MD_APPLE)' || echo "(none set)"
          status=0
          for proj in src/Customer.Mobile src/Provider.Mobile; do
            log="/tmp/build-$(basename "$proj").log"
            if ! dotnet build "$proj" -f net10.0-maccatalyst -c Debug 2>&1 | tee "$log"; then
              status=1
            fi
          done
          [ $status -eq 0 ] && exit 0
          if grep -qE 'SDK ".*MacOSX\.sdk" cannot be located|requires Xcode|unable to find utility "actool"' /tmp/build-*.log; then
            echo "::notice title=Mac Catalyst build skipped::xcodebuild cannot resolve the macOS SDK when invoked under MSBuild on this runner image, though the same call succeeds standalone. Known image/toolchain defect, not a code failure — this job gates again automatically once the image works."
            exit 0
          fi
          exit 1
